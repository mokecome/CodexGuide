  <path d="M324 367H358M588 367H622M852 367H886" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <path d="M348 357L358 367L348 377M612 357L622 367L612 377M876 357L886 367L876 377" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="562" width="1022" height="1.5" fill="#BFD0CC"/>
  <text x="94" y="599" class="sub">建議順序：先寫清專案級 AGENTS.md，再調本機 config.toml，接著接入 MCP / Skills，最後依團隊要求管理審核和權限。</text>
