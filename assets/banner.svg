  <rect x="1040" y="164" width="330" height="310" rx="24" fill="#F4F6F2" stroke="#BFD0CC"/>
  <text x="1080" y="230" class="mono">$ codex</text>
  <text x="1080" y="286" class="small">read workspace</text>
  <text x="1080" y="338" class="small">edit safely</text>
  <text x="1080" y="390" class="small">run checks</text>
