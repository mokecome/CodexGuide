<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" fill="none" aria-labelledby="title desc" role="img" viewBox="0 0 1600 640">
  <title id="title">Codex 新手實戰指南</title>
  <desc id="desc">給台灣使用者的 Codex 新手實戰指南，從整理資料、閱讀專案到建立 AI 工作流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F2F7F6"/>
      <stop offset="1" stop-color="#DCECE8"/>
    </linearGradient>
    <style>
      .title{font:850 92px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#172033}
      .sub{font:600 34px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#475569}
      .small{font:600 24px -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#64748B}
      .mono{font:600 24px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#0F6F68}
    </style>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect x="80" y="72" width="1440" height="496" rx="36" fill="#FFFFFF" stroke="#BFD0CC"/>
  <g transform="translate(150 122)">
    <rect width="86" height="86" rx="22" fill="#172033"/>
    <path fill="#5ED0C4" d="M26 28H62V36H26z"/>
    <path fill="#A9C7DC" d="M26 45H52V53H26z"/>
    <path stroke="#F2D58A" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" d="M61 43L70 52L61 61"/>
  </g>
  <text x="150" y="286" class="title">Codex 新手實戰指南</text>
  <text x="154" y="352" class="sub">從整理資料、閱讀專案，到建立可驗證的 AI 工作流程</text>
  <g>
    <rect x="154" y="410" width="112" height="42" rx="21" fill="#CDEAE4"/>
    <text x="188" y="438" class="mono">CLI</text>
    <rect x="288" y="410" width="124" height="42" rx="21" fill="#D7E6F1"/>
    <text x="322" y="438" class="mono">Cloud</text>
    <rect x="434" y="410" width="104" height="42" rx="21" fill="#E5DFF0"/>
    <text x="466" y="438" class="mono">IDE</text>
    <rect x="560" y="410" width="146" height="42" rx="21" fill="#EDDDB7"/>
    <text x="594" y="438" class="mono">App</text>
    <rect x="728" y="410" width="190" height="42" rx="21" fill="#CDEAE4"/>
    <text x="762" y="438" class="mono">AGENTS.md</text>
